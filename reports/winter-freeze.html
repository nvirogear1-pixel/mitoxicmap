ent - no purchases, bids, or owner contact without your green light."}], "top20": [{"rank": 1, "name": "Pentwater Village Lot", "county": "Oceana", "price": 500, "channel": "NOW", "score": 70, "note": "$16,400 SEV at $500 flat, first-come over-the-counter. Village water/sewer likely availabl"}, {"rank": 2, "name": "Sugar Springs Assembly", "county": "Gladwin", "price": 100, "channel": "AUCTION", "score": 63, "note": "Sugar Springs is a 2,500-acre lake/golf community with dues and mostly unsold tiny lots - "}, {"rank": 3, "name": "Copemish 4.17 Acres", "county": "Manistee", "price": 100, "channel": "AUCTION", "score": 62, "note": "The anomaly of the whole sweep: $37,800 SEV behind a $100 no-reserve bid. Timber and firew"}, {"rank": 4, "name": "W Lakewood 6-Lot Bundle", "county": "Muskegon", "price": 1000, "channel": "OFFER", "score": 60, "note": "County land bank inventory, $0 SEV, open offer. Full due diligence already done: zero wetl"}, {"rank": 5, "name": "Mason Lot 4614", "county": "Mason", "price": 100.0, "channel": "AUCTION", "score": 60, "note": "1/2 Acre Parcel On Benson Rd - Tallman"}, {"rank": 6, "name": "Michaywe Lot 33", "county": "Otsego", "price": 100, "channel": "AUCTION", "score": 58, "note": "Michaywe is one of the best-run rec communities in northern Michigan (paved roads, ameniti"}, {"rank": 7, "name": "Pythian Park 3-Lot Bundle", "county": "Oceana", "price": 500, "channel": "NOW", "score": 57, "note": "Three contiguous lots for $500 total. Subdivision roads not fully improved - the classic r"}, {"rank": 8, "name": "Cheboygan Lot 1701", "county": "Cheboygan", "price": 100.0, "channel": "AUCTION", "score": 55, "note": "Condemned House In Cheboygan City On 1/4 Acre"}, {"rank": 9, "name": "Oceana Lot 640300", "county": "Oceana", "price": 500.0, "channel": "OTC", "score": 55, "note": "Tiny Parcel In Shelby Township."}, {"rank": 10, "name": "Otsego Lot 690438", "county": "Otsego", "price": 700.0, "channel": "OTC", "score": 52, "note": "~0.63 Acre Vacant log literally say 'access issues'.", "fix": "Before bidding: confirm road frontage in the county GIS parcel layer and pull any recorded access easement from the Register of Deeds. If neither exists, walk away.", "src": "County GIS parcel boundaries + county Register of Deeds; tax-sale.info flags access issues in lot titles", "flagged": "Alpena Diamonds Point, Manistee Copemish (S of M-115), multiple surplus lots"}, {"n": 2, "risk": "Tax-deed title that lenders won't touch", "story": "Michigan tax foreclosure wipes old liens and defects - but title insurers still want a judge's signature before they insure it.", "fix": "Budget $1,000-2,000 per parcel for a quiet-title action once you own it. Then insure. Never resell uninsured to a retail buyer.", "src": "Michigan General Property Tax Act, MCL 211.78k (foreclosed property conveys marketable title); quiet title via circuit court", "flagged": "Applies to EVERY auction purchase"}, {"n": 3, "risk": "Wetland you cannot build on", "story": "Part 303 regulates land within 500 feet of a stream or 1,000 feet of an inland lake. A wetland determination can kill your build and your resale.", "fix": "Run the EGLE Wetlands Map and NWI before bidding. If flagged, get a delineation ($300-600) or walk.", "src": "MCL 324.30301 (Natural Resources and Environmental Protection Act Part 303); EGLE Wetland Map Viewer; USFWS NWI", "flagged": "Duck Lake parcel (62 wetland polygons nearby), Oscoda 'swamp' lot, Oceana Shores lots"}, {"n": 4, "risk": "Zoning kills the plan", "story": "Camping, Airbnbs, and even 'big sheds' are use decisions made township by township. Fruitland's HDR ordinance, verified, lists no campground use at all.", "fix": "Call the zoning administrator with the parcel number BEFORE bidding. Get permitted-use answers in writing. Ask two questions: can I camp seasonally, and what does a legal dwelling require.", "src": "Fruitland Township Zoning Ordinance Article VIII (verified from official township PDF); each target townsh   for(const k of keys){
    t = t.replace(new RegExp(k.replace(/[-]/g,"\\-").replace(/,/g,"")+"(?=[\\s,.:;)]|$)","g"), GLOSSARY[k]);
  }
  t = t.replace(/\b(\d{2}-\d{2}-\d{3}-\d{3}-\d{4}-\d{2})\b/g, m=>m.split("-").join(", "));
  t = t.replace(/\b(\d{2}-\d{3}-\d{3}-\d{2})\b/g, m=>m.split("-").join(", "));
  t = t.replace(/\b(\d{1,2}-\d{1,3}-\d{3}-\d{3}(-\d{4})?(-\d{2})?)\b/g, m=>m.split("-").join(", "));
  t = t.replace(/\b([A-Z]{2,6})\b/g, m=>m.split("").join(" "));
  t = t.replace(/,\s*,/g,",").replace(/\s+\./g,".").replace(/\s{2,}/g," ");
  return t.trim();
}
function pickVoice(voices){
  if(!voices || !voices.length) return null;
  const en = voices.filter(v=>/^en[-_]/i.test(v.lang||""));
  const pool = en.length?en:voices;
  const prefs=[[/Aria.*Natural/i,100],[/Jenny.*Natural/i,96],[/Guy.*Natural/i,95],[/Ana.*Natural/i,94],
   [/Google US English/i,92],[/Online.*Natural/i,90],[/Neural/i,88],[/Samantha/i,85],
   [/Aria/i,80],[/Jenny/i,78],[/Eloquence/i,74],[/Zira/i,70],[/en[-_]US/i,45],[/en/i,25]];
  let best=null,bs=-1;
  for(const v of pool){let s=0;for(const [re,x] of prefs){if(re.test(v.name)&&x>s)s=x;}if(s>bs){bs=s;best=v;}}
  return best;
}
let VOICE=null, RATE=0.94;
function loadVoices(){
  const vs = speechSynthesis.getVoices();
  VOICE = pickVoice(vs);
  const sel = document.getElementById("vsel");
  if(sel){
    sel.innerHTML = vs.map((v,i)=>`<option value="${i}" ${v===VOICE?"selected":""}>${v.name.replace(/Microsoft |Google /,"")}</option>`).join("");
    if(VOICE){const vi = vs.indexOf(VOICE); if(vi>-1) sel.value = vi;}
  }
}
function speakNext(){
  if(qi>=queue.length){ setPlaying(false); return; }
  const u=new SpeechSynthesisUtterance(queue[qi]);
  if(VOICE) u.voice=VOICE;
  u.rate=RATE; u.pitch=0.96;
  u.onend=()=>{ qi++; setTimeout(speakNext, qi<queue.length?430:250); };
  u.onerror=()=>{ qi++; setTimeout(speakNext, 150); };
  speechSynthesis.speak(u);
}
let queue=[], qi=0;
function buildQueue(sec){
  const h2 = sec.querySelector("h2"), narr = sec.querySelector(".narr");
  const cards = [...sec.querySelectorAll(".card")].map(c=>{
    const lbl=c.querySelector(".lbl"), val=c.querySelector(".val"), sub=c.querySelector(".sub");
    return [lbl?lbl.textContent:"", val?val.textContent:"", sub?sub.textContent:""].filter(Boolean).join(". ");
  }).join(". ");
  let text = (h2?h2.textContent+". ":"") + (narr?narr.textContent:"") + (cards?" "+cards:"");
  const st = speakable(text);
  return (st.match(/[^.!?…]+[.!?…]+/g)||[st]).map(s=>s.trim()).filter(Boolean);
}
function playReport(){
  const secs=document.querySelectorAll(".sec");
  if(!secs.length) return;
  if(idx>=secs.length){idx=0; setPlaying(false); return;}
  secs[idx].scrollIntoView({behavior:"smooth",block:"start"});
  if(window.speechSynthesis){
    speechSynthesis.cancel(); queue=buildQueue(secs[idx]); qi=0;
    if(queue.length) setTimeout(speakNext, 350);
  }
  idx++;
  if(idx>=secs.length) setTimeout(()=>setPlaying(false), 1000);
}
function setPlaying(on){
  const b=document.getElementById("play");
  if(b) b.innerHTML = on? "❚❚ Reading…" : "▶ Read This Report";
}

document.addEventListener('keydown',e=>{if(e.key==='ArrowRight')playReport();if(e.key==='ArrowLeft'){idx=Math.max(0,idx-2);playReport();}});
function showDrawer(b){
  const d=document.getElementById('drawer');
  d.innerHTML=`<b style="color:var(--acc)">${b.textContent}</b><br><span style="color:var(--mut)">Source:</span> ${b.dataset.src}`+
    (b.dataset.url?`<br><a style="color:#60a5fa" href="${b.dataset.url}" target="_blank">Open source documentation →</a>`:'')+
    `<br><span style="color:var(--mut);font-size:11px">Every claim in this report carries its evidence class. Click any badge to see its source.</span>`;
  d.classList.add('open');
  setTimeout(()=>d.classList.remove('open'),7000);
}
</script><div id="vbar" style="position:fixed;bottom:14px;right:14px;z-index:999;background:#161b22f0;border:1px solid #2a3644;border-radius:10px;padding:8px 10px;display:flex;gap:8px;align-items:center;font-size:12px">
<span style="color:#8aa">🎙</span>
<select id="vsel" style="background:#0d1117;color:#cfe;border:1px solid #2a3644;border-radius:6px;padding:3px 5px;max-width:170px"></select>
<span style="color:#8aa">speed</span>
<input id="vrate" type="range" min="0.8" max="1.15" step="0.02" value="0.94" style="width:70px">
</div>
<script>
if(window.speechSynthesis){speechSynthesis.onvoiceschanged=loadVoices;loadVoices();}
document.addEventListener('DOMContentLoaded',()=>{const s=document.getElementById('vsel');if(s)s.onchange=e=>{VOICE=speechSynthesis.getVoices()[e.target.value];};const r=document.getElementById('vrate');if(r)r.oninput=e=>{RATE=parseFloat(e.target.value);};});
</script>
