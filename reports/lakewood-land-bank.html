pplication, Not a Listing", "narration": "This parcel is not on the market in the usual sense. It sits in land bank inventory, and the county takes offers through a property purchase application where you enter your own number. That means an offer in the five hundred to two thousand dollar range is a legitimate proposal, not an insult. The catch: the Land Bank Board reviews every application and approves or declines. This is a patient-money play. You are trading price for process. There is no published price, so everything until board approval is conditional.", "map": {"zoom": 16, "layers": ["parcel"]}}, {"id": "market", "kicker": "3 - THE MARKET LENS", "title": "What This Land Sells For When It Sells", "narration": "For context from the open market: the cheapest advertised vacant lot near Twin Lake lists around fifteen thousand dollars. A two point four two acre bundle in the Village of Lakewood Club sold for twenty two thousand dollars in early twenty twenty five. And at the county tax auction in August, a Twin Lake mobile home and shed went for one thousand nine hundred dollars. So the floor for land in this corridor is real, and it sits far below list prices. A land bank acceptance in the one to two thousand range would put you at auction-floor pricing for a clean, dry, platted parcel.", "map": {"zoom": 15, "layers": ["parcel"]}}, {"id": "environment", "kicker": "4 - ENVIRONMENTAL HISTORY", "title": "A Quiet Half Mile", "narration": "Here is the environmental scan. In the entire two-mile ring there are only two Part two oh one contamination sites. The nearest is zero point six miles away on Whitehall Road, flagged as inadequate data to assign risk. The next is nearly three miles out. The nearest underground storage tanks are at zero point five seven miles with no known risks, and the one facility with active risk findings is over a mile away. There are zero brownfield sites in the scan. For a county known for its industrial legacy, this is a quiet corner.", "map": {"zoom": 13, "layers": ["parcel", "part201", "ust"]}}, {"id": "wetlands", "kicker": "5 - WETLANDS", "title": "Dry Ground, Verified Against the Boundary", "narration": "We ran the National Wetlands Inventory directly against the parcel polygon, not just the neighborhood. Result: zero mapped wetland polygons touch this parcel. The nearest mapped wetland is about half a mile away. This matters because it removes the single most common deal killer on cheap Michigan lots, and it separates this parcel from the five hundred dollar swamp lots you see on surplus lists.", "map": {"zoom": 14, "layers": ["parcel"]}}, {"id": "underground", "kicker": "6 - WHAT IS UNDERGROUND", "title": "Fifty-Four Wells Tell the Story", "narration": "We pulled three hundred sixty one WelLogic well records for this area. Fifty four usable records sit within a mile and a half. The picture: wells here run twenty eight to fifty four feet deep, hitting an ice-contact outwash aquifer, with static water levels five to twenty six feet down. The nearest well is practically next door on Whitehall Road, fifty three feet deep with water at seven feet. If you ever build, you will not be drilling deep, but that shallow water table is also the septic constraint we flag later.", "map": {"zoom": 14, "layers": ["parcel", "wells"]}}, {"id": "groundwater", "kicker": "7 - GROUNDWATER DIRECTION", "title": "Modeled West Toward White Lake - With an Honest Asterisk", "narration": "The modeled water table surface at this parcel sits around six hundred fifty eight feet elevation, sloping west at about nine feet per mile, which points toward White Lake. Now the honest asterisk: the statistical fit is weak, R squared zero point one seven on fifty four wells. That means direction is indicative, not proven. We will not sell you certainty the data cannot support. What we can say: the nearest contamination site sits roughly cross-gradient, so neither plainly up nor down the modeled flow, and it carries undetermined risk status.", "map": {"zoom": 13, "layers": ["parcel", "wells", "surface", "contours", "flow"]}}, {"id": "camping", "kicker": "8 - THE CAMPING QUESTION", "title": "What the Township Ordinance Actually Says", "narration": "You asked about camping. Fruitland Township's HDR district, straight from the township's own ordinance: single-family and two-family homes are permitted by right. Public parks, playgrounds, and bed and breakfasts are possible by special land use. Campgrounds are not a listed use at all, in either category. So here is the truth: short-term tent camping on your own land is informally tolerated in most Michigan townships, but it is not an authorized use here, and a permanent camp setup would be a zoning exposure. The realistic paths are hold it as cheap land bank inventory, or pursue the by-right single family build, which brings the septic question next.", "map": {"zoom": 16, "layers": ["parcel"]}}, {"id": "verify", "kicker": "9 - WHAT TO VERIFY NEXT", "title": "Four Gate Items Before Money Moves", "narration": "Before a dollar moves, four things need answers. One: the Land Bank itself, at two three one, seven two four, six one seven zero, for lien and encumbrance status and board terms. Two: the Fruitland Township zoning administrator, to confirm camping tolerance and buildability on bundled substandard-width lots. Three: district health septic feasibility, because a shallow water table on a third of an acre with a fifty foot front setback is tight. Four: the FEMA flood map, which we could not reach from our systems today. The fleet is also on this: Jet is verifying the boundary geometry and Historian is running the environmental sweep, and their findings will be folded in when they report.", "map": {"zoom": 15, "layers": ["parcel", "wells", "surface"]}}, {"id": "verdict", "kicker": "10 - VERDICT", "title": "Land Bank Zero Carry, If the Board Says Yes", "narration": "The verdict. Environmentally this parcel is cleaner than its price class: no wetlands on the const c = R.property.centroid;
const map = L.map('map', {zoomControl:true, attributionControl:true}).setView(c, 14);
L.DomUtil.addClass(map.getContainer(),'leaflet-fade-anim');
setTimeout(()=>map.invalidateSize(), 50); setTimeout(()=>map.invalidateSize(), 500);
window.addEventListener('load', ()=>map.invalidateSize());
L.marker(c, {icon: L.divIcon({className:'', html:'<div style="background:#7c3aed;color:#fff;font-weight:700;font-size:12px;padding:6px 12px;border-radius:8px;border:2px solid #fff;white-space:nowrap;box-shadow:0 4px 14px rgba(0,0,0,.5)">&#11088; W Lakewood Rd - Land Bank Parcel</div>', iconAnchor:[-14,14]})})
 .addTo(map).bindPopup('<b>W Lakewood Rd (Land Bank Parcel)</b><br>Whitehall, MI 49461<br>0.34 acres · PIN 61-06-404-067-0009-00');
let tErr=0;
const baseTiles = L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {maxZoom:19, attribution:'© OpenStreetMap © CARTO'}).addTo(map);
baseTiles.on('tileerror', ()=>{ tErr++;
  if(tErr===25){ map.removeLayer(baseTiles);
    const osm = L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {maxZoom:19, attribution:'© OpenStreetMap contributors'});
    osm.addTo(map);
    const st=document.createElement('style'); st.textContent='.leaflet-tile{filter:invert(1) hue-rotate(180deg) brightness(.85) saturate(.7)}';
    document.head.appendChild(st);
  }
});
L.control.zoom({position:'bottomleft'}).addTo(map);

const Lp = {}, lgr = L.layerGroup();
function ramp(v){const[lo,hi]=R.layers.surface.ramp;let t=Math.min(1,Math.max(0,(v-lo)/(hi-lo)));
const s=[[8,48,107],[33,113,181],[107,174,214],[198,219,239]];const x=t*(s.length-1);const i=Math.min(s.length-2,Math.floor(x));const f=x-i;
const a=s[i],b=s[i+1];return `rgb(${Math.round(a[0]+(b[0]-a[0])*f)},${Math.round(a[1]+(b[1]-a[1])*f)},${Math.round(a[2]+(b[2]-a[2])*f)})`}

Lp.parcel = L.polygon(R.property.polygon, {color:'#34d399', weight:2.5, fillOpacity:.12}).addTo(map).bindPopup(`<b>${R.property.address}</b><br>PIN ${R.property.parcel_id} · ${R.property.acreage} acres`);
Lp.wells = L.layerGroup(R.layers.wells.map(w=>L.circleMarker([w[0],w[1]],{radius:3,color:ramp(w[2]),weight:0,fillOpacity:.75}).bindPopup(`Well record · water table ${w[2]} ft · ${w[3]} mi from parcel`)));
const S = R.layers.surface;
Lp.surface = L.imageOverlay('data:image/png;base64,'+S.png_b64, S.bounds, {opacity:.8});
const cg = L.layerGroup();
R.layers.contours.forEach(ct=>L.polyline(ct.pts,{color:'#dbeafe',weight:1,opacity:.35,interactive:false}).addTo(cg));
R.layers.contour_labels.forEach(lb=>L.marker([lb[1],lb[2]],{icon:L.divIcon({className:'',html:`<div style="background:rgba(13,21,36,.75);color:#dbeafe;font-size:10px;font-weight:700;padding:1px 5px;border-radius:4px;white-space:nowrap">${lb[0]} ft</div>`})}).addTo(cg));
Lp.contours = cg;
const F = R.layers.flow, az=F.az*Math.PI/180;
Lp.flow = L.layerGroup([
  L.polyline([[c[0],c[1]],[c[0]-Math.cos(az)*0.030, c[1]-Math.sin(az)*0.030]],{color:'#a78bfa',weight:3,dashArray:'8 8',opacity:.9}),
  L.circleMarker([c[0]-Math.cos(az)*0.030,c[1]-Math.sin(az)*0.030],{radius:6,color:'#a78bfa',fillColor:'#a78bfa',fillOpacity:1}).bindTooltip('Modeled flow: SE @ ~'+F.mag+' ft/mi',{permanent:false})
]);
Lp.part201 = L.layerGroup(R.layers.part201.map(s=>L.circleMarker([s[0],s[1]],{radius:7,color:'#e53e3e',weight:1.4,fillColor:'#e53e3e',fillOpacity:.28}).bindPopup(`<b>Part 201: ${s[2]}</b><br>EGLE ID ${s[4]}<br>${s[3]} mi · ${s[5]<60?s[5]:s[5]}`)));
Lp.ust = L.layerGroup(R.layers.ust.map(u=>L.circleMarker([u[0],u[1]],{radius:6,color:'#f5a623',weight:1.2,fillColor:'#f5a623',fillOpacity:.25}).bindPopup(`<b>UST: ${u[2]}</b><br>${u[3]} mi`)));
Lp.brownfield = L.layerGroup(R.layers.brownfield.map(b=>L.circleMarker([b[0],b[1]],{radius:6,color:'#facc15',weight:1.2,fillColor:'#facc15',fillOpacity:.2}).bindPopup(`Brownfield site · ${b[2]} mi`)));
Lp.wetlands = L.layerGroup(R.layers.wetlands.map(w=>L.circleMarker([w[0],w[1]],{radius:6,color:'#22c55e',weight:1.2,fillColor:'#22c55e',fillOpacity:.2}).bindPopup(`<b>${w[2]}</b><br>${w[3]} mi · ${w[4]} ac`)));

// ---- build panel ----
const panel = document.getElementById('panel');
let html = '<div class="cards">' + R.cards.map(cd=>`<div class="card"><div class="lbl">${cd.label}</div><div class="val">${cd.value}</div><div class="sub">${cd.sub}<br><button class="ev e${cd.evidence.label[0]}" data-src="${cd.evidence.source}" data-url="${cd.evidence.url||''}">${cd.evidence.label}</button></div></div>`).join('') + '</div>';
R.sections.forEach((s,i)=>{html+=`<div class="sec" id="sec${i}"><div class="kicker">${s.kicker}</div><h2>${s.title}</h2><div class="narr">${s.narration}</div>${i===6?'<div class="clean"><ul>'+R.what_we_didnt_find.map(x=>`<li>✓ ${x}</li>`).join('')+'</ul></div>':''}</div>`});
html += `<div class="sec"><div class="kicker">SOURCES & EVIDENCE</div><h2>Source Ledger</h2><div id="ledger">${R.sources.map(s=>`<div class="src"><span class="ev e${s.class[0]}">${s.class}</span><span>${s.name}${s.url?` — <a href="${s.url}" target="_blank">source</a>`:''}</span></div>`).join('')}</div><p class="disclaim">${R.disclaimer}</p></div>`;
panel.innerHTML = html;
const secs=[...document.querySelectorAll('.sec')];

function activate(i){
  secs.forEach((s,j)=>s.classList.toggle('on', j===i));
  const m=R.sections[i]; if(!m) return;
  map.flyTo(m.map.center||c, m.map.zoom||14, {duration:1.2});
  Object.keys(Lp).forEach(k=>{ if((m.map.layers||[]).includes(k)) Lp[k].addTo(map); else map.removeLayer(Lp[k]); });
  const el=document.getElementById('sec'+i); if(el && el.scrollIntoView) el.scrollIntoView({block:'start'});
}
panel.addEventListener('scroll',()=>{ if(playing) return; const mid=panel.scrollTop+panel.clientHeight*0.3; let idx=0; secs.forEach((s,i)=>{ if(s.offsetTop<=mid) idx=i; }); if(idx!==cur){cur=idx;activate(idx);} });
let cur=0; activate(0);

// ---- read aloud ----
let playing=false, queue=[], voices=window.speechSynthesis?speechSynthesis.getVoices():[];
function speak(txt){ const u=new SpeechSynthesisUtterance(txt.replace(/·/g,',').replace(/–/g,' ')); u.rate=.98; u.pitch=1; const v=voices.find(v=>/en[-_]/.test(v.lang)&&/female|samantha|zira|aria/i.test(v.name)); if(v)u.voice=v; speechSynthesis.speak(u); return u; }
function playAll(){
  if(!('speechSynthesis' in window)){alert('Read-aloud needs a modern browser.');return}
  if(playing){ speechSynthesis.cancel(); playing=false; document.getElementById('readbtn').classList.remove('playing'); document.getElementById('readbtn').textContent='▶ Read This Report'; return; }
  playing=true; const btn=document.getElementById('readbtn'); btn.classList.add('playing'); btn.textContent='■ Stop';
  const cards = 'Property snapshot. '+R.cards.map(cd=>cd.label+'. '+cd.value+'. '+cd.sub.replace(/·/g,',')).join('. ');
  const texts=[cards, ...R.sections.map(s=>s.title+'. '+s.narration), 'Source ledger. '+R.sources.map(s=>s.class+'. '+s.name).join('. ')];
  let i=0;
  function next(){
    if(!playing) return;
    if(i>=texts.length){ playing=false; btn.classList.remove('playing'); btn.textContent='▶ Read This Report'; return; }
    if(i>0 && i-1<R.sections.length) activate(i-1);
    const u=speak(texts[i]); i++;
    u.onend=()=>setTimeout(next,600); u.onerror=()=>setTimeout(next,300);
  }
  next();
}
document.getElementById('readbtn').addEventListener('click', playAll);

// ---- evidence drawer ----
const drawer=document.getElementById('drawer');
function esc(s){return String(s).replace(/"/g,'&quot;')}
document.addEventListener('click',e=>{
  const b=e.target.closest('.ev'); if(!b) return;
  drawer.innerHTML=`<h3>EVIDENCE: ${b.textContent}</h3><div class="src"><span>Source: <b>${esc(b.dataset.src||'—')}</b></span>${b.dataset.url?` — <a href="${b.dataset.url}" target="_blank">open source ↗</a>`:''}</div><div class="src"><span style="color:#8fa3bf">Every claim in this report carries its evidence class. Click any badge to see its source.</span></div>`;
  drawer.classList.add('open');
  setTimeout(()=>{drawer.classList.remove('open')},6000);
});
</script>
