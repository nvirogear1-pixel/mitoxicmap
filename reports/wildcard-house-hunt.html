  return 'OWNER';
}
const ACCEPT={INVESTOR:{low:.72,fair:.95,over:.99},'LAND BANK':{low:.9,fair:.99,over:.99},
 REO:{low:.58,fair:.86,over:.99},FSBO:{low:.42,fair:.74,over:.96},OWNER:{low:.3,fair:.7,over:.95}};
function repairAllowance(p){
  const ratio=p.ppsf/MED; let base= ratio<0.6?0.25: ratio<0.8?0.15: ratio<1.0?0.08:0.05;
  const age=p.yr?Math.max(0,(2026-(+p.yr))):45;
  if(age>60)base+=0.06; else if(age>35)base+=0.03;
  return Math.round(p.val*base/500)*500;
}

function envLine(p){
  if(p.envc==='none') return 'Not screened - no verified parcel match. Do not treat as clean.';
  const n=(p.env||'').match(/^(\d+)/); const cnt=n?n[1]:'0';
  const nearest=p.envn?('nearest '+p.envn+' '+p.envd+' mi'):'';
  const con=p.envct?(' · '+(p.envct.length>42?p.envct.slice(0,42)+'…':p.envct)):'';
  const head=(cnt==='0')?('0 sites within 1 mi'):(cnt+' site'+(cnt==='1'?'':'s')+' within 1 mi');
  return head+(nearest?(' · '+nearest):'')+con+((p.envrc)?(' · '+p.envrc):'');
}
function intelFor(p){
  const st=sellerType(p); const pp=p.ppsf;
  return [
    {k:'owner',t:(p.role||'Owner')+' — seller: '+st,
     cls:(st==='REO'||st==='LAND BANK')?'bad':'good'},
    {k:'val',t:pp?('$'+pp+'/sq ft vs $'+MED+' county median'):'Size unverified', cls:pp?(pp<MED*0.85?'good':'bad'):''},
    {k:'Part 201',t:envLine(p),cls:(p.envc==='bad'||p.envc==='none')?'bad':'good'},
    {k:'pin',t:p.pin&&p.pin!=='pending county match'?'Parcel verified':'Parcel unverified', cls:p.pin&&p.pin!=='pending county match'?'good':'bad'}
  ];
}
function reveal(i){
  const p=S.hand[i]; if(!S.revealed)S.revealed={};
  const known=S.revealed[i]||0; if(known>=4)return;
  if(S.tokens<=0){flash('No tokens left this game.');return;}
  S.tokens--; S.revealed[i]=known+1; render();
}
function flash(m){const l=$('log');l.innerHTML='<div class="log">'+m+'</div>';}
function offer(i,kind){
  if(S.phase!=='deal')return;
  const p=S.hand[i]; const mult=kind==='low'?0.9:kind==='over'?1.05:1;
  const price=Math.round(p.price*mult/500)*500;
  const st=sellerType(p); const prob=ACCEPT[st][kind];
  const won=Math.random()<prob;
  S.phase='resolved';
  if(won&&price<=S.budget){
    const repairs=repairAllowance(p);
    const sizeAdj=(p.sf>3000?0.72:(p.sf>2000?0.88:1));const implied=(p.val?p.val*sizeAdj:p.price*1.05);const equity=implied-price-repairs;
    S.equity+=equity; S.budget-=price;
    S.last={won:true,p,price,repairs,equity,st,kind};
  } else {
    S.last={won:false,p,price,st,kind,reason:price>S.budget?("over your remaining budget of "+money(S.budget)):"offer declined by the seller"};
  }
  S.phase='resolved'; render();
}
function next(){
  S.round++; S.revealed={}; S.last=null;
  if(S.round>=ROUNDS){S.phase='end';render();return;}
  deal();
}
function badgeFor(eq){
  if(eq>=120000)return 'SHARP EYE — you bought the block';
  if(eq>=60000)return 'BARGAIN HUNTER';
  if(eq>=20000)return 'SOLID READ';
  if(eq>=0)return 'BROKE EVEN, BRUISED';
  return 'THE BANK OWNS YOUR STORY';
}
function render(){
  hud();
  const s=$('stage'); s.innerHTML='';
  const btn=$('btnMain');
  if(S.phase==='idle'){btn.textContent='Deal the first round';btn.disabled=false;return;}
  if(S.phase==='end'){
    btn.textContent='Play again';btn.disabled=false;
    const box=el('div','card');box.style.textAlign='center';
    box.appendChild(el('div','brand','Final result'));
    box.appendChild(el('div','finalscore','<div class="n">'+money(S.equity)+'</div><div class="b">'+badgeFor(S.equity)+'</div>'));
    const rec=el('div','recap', S.log.map(l=>'<div>Round '+l.r+': '+l.t+'</div>').join(''));
    box.appendChild(rec);
    s.appendChild(box);
    const sh=el('div','card');
    sh.appendChild(el('div','addr','Send this to Joe'));
    sh.appendChild(el('div','meta','Screenshot the score, or open the full list of 25 houses and pick your favorite for a deep report.'));
    const a=el('a','',''); a.href='https://nvirogear1-pixel.github.io/mitoxicmap/reports/wildcards-first-list.html';
    a.style.color='var(--green)';a.style.fontWeight='700';a.textContent='Open the full property list →';
    sh.appendChild(a); s.appendChild(sh);
    return;
  }
  if(S.phase==='resolved'){
    btn.textContent=S.round>=ROUNDS-1?'See final score':'Next round';btn.disabled=false;
    const L=S.last; const c=el('div','card');
    const head=el('div',''); 
    head.appendChild(el('div','addr',L.p.n+(L.p.tag?'<span class="badge '+L.p.tag+'">'+L.p.tag+'</span>':'')));
    head.appendChild(el('div','city',L.p.c));
    const big=el('div','big', L.won?'ACCEPTED at '+money(L.price):'DECLINED');
    big.style.color=L.won?'var(--green)':'var(--red)';big.style.fontSize='20px';big.style.fontWeight='800';
    head.appendChild(big);
    c.appendChild(head);
    const det=el('div','log');
    if(L.won){
      det.innerHTML='<div>Seller: '+L.st+' &middot; offer: '+(L.kind==='low'?'10% under ask':L.kind==='over'?'5% over ask':'at ask')+'</div>'+
      '<div>Modeled repairs: '+money(L.repairs)+'</div><div class="big '+(L.equity>=0?'pos':'neg')+'">Equity: '+money(L.equity)+'</div>';
    } else {
      det.innerHTML='<div>Seller: '+L.st+' &middot; ask: '+money(L.p.price)+'</div><div>'+L.reason+'. You keep your money, and you kept your discipline.</div>';
    }
    c.appendChild(det); s.appendChild(c);
    return;
  }
  // dealing
  btn.textContent='Pick a house above';btn.disabled=true;
  const bar=el('div','log','Round '+(S.round+1)+' of '+ROUNDS+' &middot; tap a dashed chip to spend an inspection token (one per fact).');
  s.appendChild(bar);
  S.hand.forEach((p,i)=>{
    const c=el('div','card');
    c.appendChild(el('div','addr',p.n+(p.tag?'<span class="badge '+p.tag+'">'+p.tag+'</span>':'')));
    c.appendChild(el('div','city',p.c));
    c.appendChild(el('div','price',money(p.price)));
    c.appendChild(el('div','meta',p.s+' &middot; '+(p.yr?('built '+p.yr):'year unverified')));
    const intel=el('div','intel');
    const known=S.revealed[i]||0; const facts=intelFor(p);
    facts.forEach((f,fi)=>{
      const chip=el('span','chip '+(fi<known?f.cls:'locked'), fi<known?f.t:('? '+(f.k==='owner'?'who is selling':f.k==='val'?'price per sq ft':f.k==='env'?'environmental':'parcel check')));
      if(fi>=known)chip.onclick=()=>reveal(i);
      intel.appendChild(chip);
    });
    c.appendChild(intel);
    const row=el('div','row3');
    [['low','Lowball 10% under'],['fair','Offer at ask'],['over','5% over ask']].forEach(([k,label])=>{
      const b=el('button','',label); b.onclick=()=>offer(i,k); row.appendChild(b);
    });
    c.appendChild(row);
    s.appendChild(c);
  });
}
$('btnMain').onclick=()=>{
  if(S.phase==='idle'){deal();return;}
  if(S.phase==='resolved'){S.log.push({r:S.round+1,t:S.last.won?(S.last.p.n+' at '+money(S.last.price)+', +'+money(S.last.equity)):(S.last.p.n+' — declined, walked away')});next();return;}
  if(S.phase==='end'){S={round:0,tokens:START_TOKENS,budget:BUDGET,equity:0,hand:[],phase:'idle',log:[],revealed:{},last:null};render();return;}
};
$('btnRules').onclick=()=>{
  const s=$('stage'); s.innerHTML='';
  const c=el('div','card');
  c.innerHTML='<div class="addr">How it works</div><div class="meta">A decision game on real Muskegon houses.</div>'+
  '<div class="note" style="font-size:13px;color:var(--txt)">Five rounds. Three houses each. You start with $250,000 and ten inspection tokens.<br><br>'+
  'Tap a dashed chip to spend a token and reveal a fact: who is selling, price per square foot against the county median of $'+MED+', the environmental screen, and whether the parcel is verified.<br><br>'+
  'Then make an offer: 10% under, at ask, or 5% over. Investors and land banks accept lowballs; owner-occupants and FSBOs rarely do. A bank will meet you in the middle.<br><br>'+
  '<b>Every address, price, owner, parcel number and environmental result is real</b>, pulled November 8, 2026. The repair allowance and the seller behaviour are a model built for play, not an assessment of any house.</div>';
  s.appendChild(c);
};
render();
window.GAME={S,deal,reveal,offer,next,render};
</script></body></html>
