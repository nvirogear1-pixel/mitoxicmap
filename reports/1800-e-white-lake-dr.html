984, -86.196536], "zoom": 14, "layers": ["parcel", "wells"]}}, {"id": "groundwater", "kicker": "5 \u00b7 GROUNDWATER DIRECTION", "title": "Nearly Flat, Weakly To The North", "narration": "Here is where we slow down and tell the truth. We modeled the water table surface from those wells. The best fit says water table elevation near the parcel is about six hundred seventy feet, with a weak gradient of about six feet per mile flowing toward the north northwest. But the statistical confidence is low. The fit explains only eleven percent of the variation, because this water table is nearly flat and locally patchy. We will not claim a confident flow direction here, and we will not use this model to say contamination would or would not reach the parcel. The honest statement is: nearly flat, weakly northerly, low confidence. What matters practically is that the nearest known contamination site is a mile and a half away, and section six shows that.", "map": {"center": [43.382984, -86.196536], "zoom": 13, "layers": ["parcel", "wells", "surface", "contours", "flow"]}}, {"id": "environment", "kicker": "6 \u00b7 ENVIRONMENTAL HISTORY", "title": "A Clean Mile, Then Quiet Roads", "narration": "The environmental screening is genuinely calm. Zero state-listed contamination sites within one mile of this parcel. The nearest Part 201 site is one and a half miles away, a site awaiting lead division assignment. There are only two listed sites within two miles, and the small Holton Road cluster sits more than two miles out. No brownfield sites appear in the scan area at all. The nearest underground storage tanks are over a mile away and flagged with no known risks. For a rural residential parcel, this is about as quiet as the public environmental record gets in this county.", "map": {"center": [43.382984, -86.196536], "zoom": 13, "layers": ["parcel", "part201", "ust"]}}, {"id": "clean", "kicker": "7 \u00b7 WHAT WE DIDN'T FIND", "title": "Sometimes Nothing Is The News", "narration": "Just
